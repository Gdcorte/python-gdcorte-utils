name: Publish Library to PyPI

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  tag:
    name: Create new tag
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Get code
        uses: actions/checkout@v7

      - name: Create Tag
        run: |
          tagVersion=v$(cat package.json | jq '.version' -r)
          git config user.name "auto-publisher"
          git tag $tagVersion
          git push --tags
        shell: bash

  publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/<your-package-name>
    permissions:
      id-token: write # MANDATORY for Trusted Publishing / OIDC

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build distribution package
        run: python -m build

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
