name: Publish Library to PyPI

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  tag:
    name: Create new tag
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Get code
        uses: actions/checkout@v7

      - name: Create Tag
        run: |
          tagVersion=v$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          git config user.name "auto-publisher"
          git tag $tagVersion
          git push --tags
        shell: bash

  publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/gdcutils

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: prepare deps
        run: uv sync --all-groups --all-extras

      - name: Build distribution package
        run: uv build

      - name: Publish package to PyPI
        run: uv publish --trusted-publishing always
