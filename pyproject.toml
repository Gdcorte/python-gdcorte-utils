[build-system]
requires = ["setuptools >= 82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "gdcorte-utils"
version = "0.1.0"
requires-python = ">=3.14"
description = "Simple package with utility functions for everyday projects in Python"
authors = [
  { name="Gustavo Diniz da Corte", email="gustavodacorte@gmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
readme = "README.md"
dependencies = []

[dependency-groups]
dev = [
    "psycopg>=3.3.4",
    "python-dotenv>=1.2.2",
    "whenever>=0.10.0",
]
linter = [
    "mypy>=2.1.0",
    "pylint>=4.0.5",
    "pylint-pydantic>=0.4.1",
    "pyright>=1.1.409",
    "ruff>=0.15.13",
]
testing = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
]

[project.urls]
Homepage = "https://github.com/Gdcorte/base-utils-backend-lib"
Issues = "https://github.com/Gdcorte/base-utils-backend-lib/issues"
Repository = "https://github.com/Gdcorte/python-gdcorte-utils"

[tool.setuptools.package-data]
gdcutils = ["py.typed"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 160

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pylint]
load-plugins = "pylint_pydantic"

[tool.pylint.reports]
reports = false
score = false

[tool.pylint.messages_control]
disable = [
    "fixme",
]

[tool.pylint.similarities]
min-similarity-lines = 20
ignore-imports = "yes"

[tool.pytest.ini_options]
asyncio_mode = "auto"
